<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResumeLens AI — AI Resume Analyzer & ATS Match Scoring</title>
    <meta
      name="description"
      content="Analyze your resume against any job description with ATS compatibility scoring, keyword gap detection, bullet rewrites, tailored cover letters, and interview prep."
    />
    <meta property="og:title" content="ResumeLens AI — AI Resume Analyzer & ATS Match Scoring" />
    <meta
      property="og:description"
      content="Analyze your resume against any job description with ATS compatibility scoring, keyword gap detection, bullet rewrites, tailored cover letters, and interview prep."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('resumelens_theme');
          if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white text-slate-900 antialiased selection:bg-teal-500/20 selection:text-teal-900 dark:bg-slate-950 dark:text-slate-100 dark:selection:text-teal-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
